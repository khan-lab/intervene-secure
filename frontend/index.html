<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intervene Secure — A secure platform for genomic intersections, annotation and enrichment in the browser</title>
    <meta
      name="description"
      content="Intersect, annotate and test genomic region sets (BED, narrowPeak, VCF) for enrichment entirely in your browser with bedtools compiled to WebAssembly. No data upload, no login: safe for patient and other sensitive data."
    />
    <meta
      name="keywords"
      content="genomic intersection, UpSet plot, Venn diagram, bedtools, WebAssembly, BED, narrowPeak, VCF, ChIP-seq, region annotation, enrichment analysis, GO enrichment, GREAT, Cistrome-GO, privacy, no data upload"
    />
    <meta name="author" content="Aziz Khan" />
    <meta name="application-name" content="Intervene Secure" />
    <link rel="canonical" href="https://khan-lab.github.io/intervene-secure/" />

    <!-- Privacy: links to other sites (AmiGO, DOIs) do not send this page's URL as referrer. -->
    <meta name="referrer" content="no-referrer" />
    <!-- Stop iOS turning region counts and coordinates into phone-number links. -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons and browser chrome (the app has a light theme only) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-title" content="Intervene" />

    <!-- Link previews (Open Graph: Slack, LinkedIn, Mastodon, ...; Twitter/X card) -->

    <meta property="og:site_name" content="Intervene Secure" />
    <meta property="og:title" content="Intervene Secure — genomic intersections, annotation and enrichment in the browser" />
    <meta
      property="og:description"
      content="Intersect, annotate and test genomic region sets for enrichment in your browser with bedtools in WebAssembly. Files are never uploaded."
    />
    <meta property="og:url" content="https://khan-lab.github.io/intervene-secure/" />
    <meta property="og:image" content="https://khan-lab.github.io/intervene-secure/intervene-secure.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1632" />
    <meta property="og:image:height" content="802" />
    <meta property="og:image:alt" content="Intervene Secure" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Intervene Secure — genomic intersections, annotation and enrichment in the browser" />
    <meta
      name="twitter:description"
      content="Intersect, annotate and test genomic region sets for enrichment in your browser with bedtools in WebAssembly. Files are never uploaded."
    />
    <meta name="twitter:image" content="https://khan-lab.github.io/intervene-secure/intervene-secure.png" />
    <meta name="twitter:image:alt" content="Intervene Secure" />
